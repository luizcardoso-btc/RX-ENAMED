<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Arial, Helvetica, sans-serif" role="img"><title>Atonía uterina: secuencia de conductas</title><rect width="640" height="560" fill="#ffffff"/><defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs><text x="320.0" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#0b1b3a">Atonía uterina: secuencia de conductas</text><rect x="40" y="50" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="72" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Masaje uterino bimanual</text><text x="240.0" y="91" font-size="12" text-anchor="middle" fill="#0b1b3a">Acceso de grueso calibre, Ringer lactato, sonda vesical</text><line x1="240.0" y1="104" x2="240.0" y2="128" stroke="#1f2937" stroke-width="2" marker-end="url(#s)"/><rect x="40" y="130" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="152" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Oxitocina</text><text x="240.0" y="171" font-size="12" text-anchor="middle" fill="#0b1b3a">5 UI IV lento + 20–40 UI en 500 mL a 250 mL/h</text><line x1="240.0" y1="184" x2="240.0" y2="208" stroke="#1f2937" stroke-width="2" marker-end="url(#s)"/><text x="248.0" y="201" font-size="11" fill="#475569">sin respuesta</text><rect x="40" y="210" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="232" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Metilergometrina</text><text x="240.0" y="251" font-size="12" text-anchor="middle" fill="#0b1b3a">0,2 mg IM · evitar si hipertensa</text><line x1="240.0" y1="264" x2="240.0" y2="288" stroke="#1f2937" stroke-width="2" marker-end="url(#s)"/><text x="248.0" y="281" font-size="11" fill="#475569">sin respuesta</text><rect x="40" y="290" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="312" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Misoprostol</text><text x="240.0" y="331" font-size="12" text-anchor="middle" fill="#0b1b3a">800 mcg vía rectal</text><line x1="240.0" y1="344" x2="240.0" y2="368" stroke="#1f2937" stroke-width="2" marker-end="url(#s)"/><text x="248.0" y="361" font-size="11" fill="#475569">sin respuesta</text><rect x="40" y="370" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="392" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Balón de taponamiento intrauterino</text><text x="240.0" y="411" font-size="12" text-anchor="middle" fill="#0b1b3a">Traje antichoque no neumático como puente</text><line x1="240.0" y1="424" x2="240.0" y2="448" stroke="#1f2937" stroke-width="2" marker-end="url(#s)"/><text x="248.0" y="441" font-size="11" fill="#475569">sin respuesta</text><rect x="40" y="450" width="400" height="54" rx="10" fill="#eef4ff" stroke="#2563eb" stroke-width="2"/><text x="240.0" y="472" font-size="15" font-weight="700" text-anchor="middle" fill="#0b1b3a">Cirugía</text><text x="240.0" y="491" font-size="12" text-anchor="middle" fill="#0b1b3a">Suturas compresivas, ligaduras vasculares, histerectomía</text><rect x="466" y="150" width="150" height="132" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="541.0" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#0b1b3a">Ácido tranexámico</text><text x="541.0" y="198" font-size="12" font-weight="400" text-anchor="middle" fill="#0b1b3a">1 g IV en 10 min,</text><text x="541.0" y="220" font-size="12" font-weight="400" text-anchor="middle" fill="#0b1b3a">hasta 3 h del parto;</text><text x="541.0" y="242" font-size="12" font-weight="400" text-anchor="middle" fill="#0b1b3a">repetir a los 30 min</text><text x="541.0" y="264" font-size="12" font-weight="400" text-anchor="middle" fill="#0b1b3a">si persiste</text><line x1="466" y1="170" x2="444" y2="170" stroke="#0f766e" stroke-width="2" stroke-dasharray="5 4"/></svg>
