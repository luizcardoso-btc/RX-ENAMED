<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha | RX ENAMED</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23102B38'/%3E%3Cg fill='none' stroke-width='8' transform='translate(6 6) scale(.81)'%3E%3Cpath d='M10 58V14H27A10 10 0 0 1 27 34H10' stroke='white'/%3E%3Cpath d='M23 34L48 58' stroke='white'/%3E%3Cpath d='M28 58L60 8' stroke='%2319A987'/%3E%3C/g%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/_rx/rx.css">
</head>
<body class="pagina-login">
<header class="rx-topo"><div class="envoltorio">
  <a class="marca" href="/"><span class="marca-simbolo" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke-width="8"><path d="M10 58V14H27A10 10 0 0 1 27 34H10" stroke="#FFFFFF" stroke-miterlimit="10"/><path d="M23 34L48 58" stroke="#FFFFFF"/><path d="M28 58L60 8" stroke="#19A987"/></svg></span><span class="marca-nome"><b>RX</b>ENAMED</span></a>
  <nav id="nav"></nav>
</div></header>
<main class="envoltorio rx-pagina" style="max-width:440px">
  <section class="rx-cartao">
    <h1 style="font-family:var(--f-display);margin-top:0">Criar nova senha</h1>
    <form id="form" novalidate>
      <label class="rx-campo"><span>Nova senha (mínimo 8 caracteres)</span><input name="senha" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="rx-campo"><span>Repita a nova senha</span><input name="repetir" type="password" autocomplete="new-password" required></label>
      <p class="rx-erro rx-oculto" id="erro" role="alert"></p>
      <button class="botao botao-primario rx-botao-largo" type="submit">Salvar e entrar</button>
    </form>
  </section>
</main>
<script type="module">
import { $, api, mostrarErro } from '/_rx/comum.js';
const token = new URLSearchParams(location.search).get('token') || '';
$('#form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  if (f.senha !== f.repetir) return mostrarErro($('#erro'), 'As senhas não são iguais.');
  try { await api('/senha/redefinir', { metodo: 'POST', corpo: { token, senha: f.senha } }); location.href = '/minha-conta'; }
  catch (err) { mostrarErro($('#erro'), err.message); }
});
</script>
</body>
</html>
